<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f8f6">
    <title>Choose a party — Have your say</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Vote home">
            <span class="brand-mark" aria-hidden="true">✓</span>
            <span>Have your say</span>
        </a>
        <a class="header-link" href="index.html">Home</a>
    </header>

    <main class="page-main">
        <div class="page-content">
            <section class="hero" aria-labelledby="page-title">
                <p class="eyebrow">Make your choice</p>
                <h1 id="page-title">Choose a party</h1>
                <p class="page-copy">Select one option from the list to continue.</p>
            </section>

            <section class="panel">
                <form data-submission="vote" data-success-url="vote-registered.html">
                    <fieldset class="party-list">
                        <legend class="panel-heading">
                            <span class="field-label">Available parties</span>
                        </legend>
                        <label class="party-option"><input type="radio" name="party" value="bjp" required> <span>BJP</span></label>
                        <label class="party-option"><input type="radio" name="party" value="congress"> <span>Congress</span></label>
                        <label class="party-option"><input type="radio" name="party" value="aap"> <span>AAP</span></label>
                        <label class="party-option"><input type="radio" name="party" value="sp"> <span>SP</span></label>
                        <label class="party-option"><input type="radio" name="party" value="rashtriya-lok-dal"> <span>Rashtriya Lok Dal</span></label>
                        <label class="party-option"><input type="radio" name="party" value="bahujan-samajwadi-party"> <span>Bahujan Samajwadi Party</span></label>
                        <label class="party-option"><input type="radio" name="party" value="shiv-sena"> <span>Shiv Sena</span></label>
                    </fieldset>
                    <button class="button" type="submit">Continue <span aria-hidden="true">→</span></button>
                    <p class="form-status" data-status role="status" aria-live="polite"></p>
                </form>
                <a class="back-link" href="index.html">← Back to options</a>
                <p class="notice">
                    <span class="notice-icon" aria-hidden="true">i</span>
                    <span>Demo only: your selection will be saved to the connected database. Do not use this for real elections.</span>
                </p>
            </section>
        </div>
    </main>

    <footer class="site-footer">A simple demo voting experience</footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
